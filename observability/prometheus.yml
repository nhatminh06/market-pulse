global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: airflow
    static_configs:
      - targets: ["statsd-exporter:9102"]
  - job_name: warehouse
    static_configs:
      - targets: ["warehouse-exporter:9103"]
