name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff
      - run: ruff check ingestion quality observability tests

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pytest pyyaml pandas pyarrow "sqlalchemy>=2,<3" "yfinance==0.2.*" "pyiceberg[s3fs,pyarrow]==0.7.1" trino
      # Uses fixtures and a local SQLite Iceberg catalog; no live Trino/MinIO/REST stack.
      - run: pytest tests/ -v

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate

  dbt-lint-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install dbt-trino sqlfluff
      - run: sqlfluff lint dbt/market_pulse/models --dialect trino
      # dbt parse only checks that the project/YAML/Jinja is well-formed — it
      # does not connect to Trino and does not verify the SQL compiles or
      # runs correctly against real data. That's covered by the manual/
      # scheduled E2E workflow (.github/workflows/e2e.yml).
      - run: cd dbt/market_pulse && dbt deps && dbt parse --profiles-dir .

  dag-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "apache-airflow==3.0.6"
      - run: |
          python - <<'PY'
          from airflow.models import DagBag

          db = DagBag("dags", include_examples=False)
          assert not db.import_errors, db.import_errors

          assert "market_pulse" in db.dags, "expected DAG id 'market_pulse' not found"
          dag = db.dags["market_pulse"]

          expected_task_ids = {"ingest_bronze", "dbt_build", "validate_gold"}
          actual_task_ids = set(dag.task_ids)
          assert actual_task_ids == expected_task_ids, (expected_task_ids, actual_task_ids)

          ingest, transform, quality = (dag.get_task(t) for t in ["ingest_bronze", "dbt_build", "validate_gold"])
          assert transform.task_id in ingest.downstream_task_ids
          assert quality.task_id in transform.downstream_task_ids
          assert dag.max_active_runs == 1
          assert ingest.retries == 0  # Unknown commit outcomes require manual reconciliation.
          assert transform.retries == quality.retries == 2

          print("DAG structure OK:", dag.dag_id, sorted(actual_task_ids))
          PY

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.yaml config --quiet
      - run: docker compose -f docker-compose.observability.yml config --quiet
      - run: docker run --rm --entrypoint promtool -v "$PWD/observability:/etc/prometheus:ro" prom/prometheus:latest check config /etc/prometheus/prometheus.yml
      - run: docker run --rm --entrypoint promtool -v "$PWD/observability:/etc/prometheus:ro" prom/prometheus:latest test rules /etc/prometheus/alert-tests.yml

  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install yamllint
      - run: |
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable, braces: disable}}" \
            .github/workflows docker-compose.yaml docker-compose.observability.yml observability/*.yml observability/grafana

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2

  m4-gitops-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - name: Verify M1–M3 Compose and Terraform paths are unchanged
        if: github.head_ref == 'feature/v2-gitops'
        run: git diff --exit-code 43c650cf5f7d390866f33cfbe4c7c47cb53a4277 HEAD -- docker-compose.yaml docker-compose.observability.yml infra/terraform .github/workflows/e2e.yml
      - name: Install checksum-verified M4 tools
        run: |
          bash infra/ci/install-m4-tools.sh "$RUNNER_TEMP/m4-tools"
          echo "$RUNNER_TEMP/m4-tools" >> "$GITHUB_PATH"
      - run: pip install 'PyYAML==6.0.2' 'jsonschema==4.25.1'
      - name: Validate M4 manifests, links, and isolation
        run: |
          python infra/ci/check-m4-static.py
          sh infra/k8s/statsd/check-mapping.sh
          sh -n infra/k8s/statsd/check-mapping.sh infra/k8s/minio/check-object.sh
          bash -n infra/ci/install-m4-tools.sh infra/ci/m4-gitops-e2e.sh
          python - <<'PY'
          from pathlib import Path
          for path in (Path('infra/flux/git-http.py'), Path('infra/ci/check-m4-static.py')):
              compile(path.read_text(), str(path), 'exec')
          print('Python syntax OK')
          PY
