name: dbt-docs

on:
  push:
    branches: [main]
    paths:
      - "dbt/market_pulse/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Write .env for the stack
        run: |
          cat > .env <<'EOF'
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin
          AWS_ACCESS_KEY_ID=minioadmin
          AWS_SECRET_ACCESS_KEY=minioadmin
          AWS_REGION=us-east-1
          EOF

      - name: Build the pipeline image
        run: docker compose build

      - name: Start MinIO only
        run: docker compose up -d minio mc-init

      - name: Wait for MinIO
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 3
          done

      - uses: hashicorp/setup-terraform@v3

      - name: Provision bucket + pipeline user
        working-directory: infra/terraform
        env:
          MINIO_USER: minioadmin
          MINIO_PASSWORD: minioadmin
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Write pipeline credentials into .env
        working-directory: infra/terraform
        run: |
          echo "PIPELINE_ACCESS_KEY=$(terraform output -raw pipeline_access_key)" >> ../../.env
          echo "PIPELINE_SECRET_KEY=$(terraform output -raw pipeline_secret_key)" >> ../../.env

      - name: Start the rest of the stack
        run: docker compose up -d iceberg-rest trino postgres airflow-init airflow-scheduler

      - name: Wait for Trino to accept queries
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/v1/info >/dev/null; then
              echo "Trino is up"
              exit 0
            fi
            echo "Waiting for Trino... ($i/30)"
            sleep 5
          done
          echo "Trino never became ready" && exit 1

      - name: Seed a small sample of real data
        run: >
          docker compose exec -T airflow-scheduler
          python /opt/airflow/ingestion/ingest_bronze.py --days 10 --tickers AAPL,MSFT,NVDA

      - name: Debug - confirm working directory and dbt install
        run: |
          docker compose exec -T airflow-scheduler bash -c "pwd; ls -la /opt/airflow/dbt/market_pulse; which dbt; dbt --version"

      - name: dbt deps
        run: |
          docker compose exec -T airflow-scheduler bash -c "cd /opt/airflow/dbt/market_pulse && dbt deps --profiles-dir ."

      - name: dbt build
        run: |
          docker compose exec -T airflow-scheduler bash -c "cd /opt/airflow/dbt/market_pulse && dbt build --profiles-dir ."

      - name: Generate docs against the real warehouse
        run: >
          docker compose exec -T airflow-scheduler
          bash -c "cd /opt/airflow/dbt/market_pulse && dbt docs generate --profiles-dir ."

      - name: Generate docs against the real warehouse
        run: >
          docker compose exec -T airflow-scheduler
          bash -c "cd /opt/airflow/dbt/market_pulse && dbt docs generate --profiles-dir ."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dbt/market_pulse/target

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4