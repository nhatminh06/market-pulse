name: e2e

# Full-stack validation against a small, deterministic fixture (NOT live
# yfinance data — see the "Load a fixture" step). This is deliberately kept
# out of pull_request: it builds and starts the entire docker-compose stack
# (MinIO, Iceberg REST, Trino, Postgres, Airflow), which is slow and uses
# more memory than is reliable on every PR. Pull requests instead get the
# fast static checks in ci.yml (dbt parse, SQLFluff, pytest, DAG import,
# compose config). This workflow is the only place dbt build/test and
# quality/validate_gold.py actually run against live Trino/Iceberg in CI.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # weekly, Monday 06:17 UTC — arbitrary off-peak time

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fixture-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Write .env for the stack
        run: |
          cat > .env <<'EOF'
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin
          AWS_ACCESS_KEY_ID=minioadmin
          AWS_SECRET_ACCESS_KEY=minioadmin
          AWS_REGION=us-east-1
          SUPERSET_SECRET_KEY=e2e-only-not-a-real-secret
          SUPERSET_ADMIN_USERNAME=admin
          SUPERSET_ADMIN_PASSWORD=admin
          EOF

      - name: Verify MinIO image before stack startup
        run: |
          image=ghcr.io/intikhab49/minio-from-source@sha256:1025a6dd8452e6fe8d3fdf16dbce7c18f8417acd22e5abd7376d8322aee5edab
          docker pull --platform linux/amd64 "$image"
          docker image inspect "$image" --format 'Pulled {{json .RepoDigests}}'
          test "$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          docker run --rm --entrypoint minio "$image" --version | grep -F 'RELEASE.2025-10-15T17-29-55Z'
          docker run --rm --entrypoint mc "$image" --version | grep -F 'RELEASE.2025-08-13T08-35-41Z'
          docker run --rm --entrypoint sh "$image" -c 'command -v curl && command -v mc'

      - name: Build the pipeline image
        run: docker compose build

      - name: Start MinIO
        run: docker compose up -d minio mc-init

      - name: Wait for MinIO
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            echo "Waiting for MinIO... ($i/20)"
            sleep 3
          done
          echo "MinIO never became ready" && exit 1

      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }

      - name: Provision bucket + pipeline user
        working-directory: infra/terraform
        env:
          MINIO_USER: minioadmin
          MINIO_PASSWORD: minioadmin
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Write pipeline credentials into .env
        working-directory: infra/terraform
        run: |
          echo "PIPELINE_ACCESS_KEY=$(terraform output -raw pipeline_access_key)" >> ../../.env
          echo "PIPELINE_SECRET_KEY=$(terraform output -raw pipeline_secret_key)" >> ../../.env

      - name: Make dbt project writable by the airflow container user
        run: sudo chown -R 50000:0 dbt

      - name: Start Iceberg REST, Trino, Postgres, Airflow
        run: docker compose up -d iceberg-rest trino postgres airflow-init airflow-scheduler

      - name: Start optional observability stack
        run: docker compose -f docker-compose.observability.yml up -d --build

      - name: Wait for Trino to accept queries
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/v1/info >/dev/null && echo "Trino is up" && exit 0
            echo "Waiting for Trino... ($i/30)"
            sleep 5
          done
          echo "Trino never became ready" && exit 1

      - name: Record Iceberg REST and Trino image identities
        run: |
          for image in trinodb/trino:latest apache/iceberg-rest-fixture:latest; do
            echo "Image $image"
            docker image inspect "$image" --format 'id={{.Id}} digests={{json .RepoDigests}}'
            test "$(docker image inspect "$image" --format '{{json .RepoDigests}}')" != '[]'
          done

      - name: Load a fixture into bronze (no live yfinance call)
        run: |
          docker compose exec -T airflow-scheduler python - <<'PY'
          import sys
          sys.path.insert(0, "/opt/airflow")
          import pandas as pd
          from datetime import datetime, timezone
          from ingestion.ingest_bronze import validate_ohlcv_frame, deduplicate_prices, get_catalog, write_bronze_table

          df = pd.read_csv("/opt/airflow/tests/fixtures/valid_ohlcv.csv", parse_dates=["date"])
          df["date"] = df["date"].dt.date
          df["_ingested_at"] = datetime.now(timezone.utc)
          df = validate_ohlcv_frame(df)
          df = deduplicate_prices(df)

          cat = get_catalog()
          tickers = sorted(df["ticker"].unique().tolist())
          n = write_bronze_table(cat, df, tickers, start=str(df["date"].min()))
          print(f"Loaded {n} fixture rows into bronze.prices for {tickers}")
          PY

      - name: Verify atomic correction and partial provider response
        run: |
          docker compose exec -T airflow-scheduler python - <<'PY'
          import sys
          sys.path.insert(0, "/opt/airflow")
          from datetime import datetime, timezone
          import pandas as pd
          import pyarrow as pa
          from pyiceberg.exceptions import CommitFailedException
          from ingestion.ingest_bronze import _replacement_filter, get_catalog, write_bronze_table

          cat = get_catalog()
          before = cat.load_table("bronze.prices").scan().to_arrow().to_pylist()
          original = {(r["ticker"], r["date"]): r for r in before}
          assert len(before) == 6
          correction = pd.read_csv("/opt/airflow/tests/fixtures/valid_ohlcv.csv", parse_dates=["date"]).iloc[[0]].copy()
          correction["date"] = correction["date"].dt.date
          correction["close"] = 101.5
          correction["adj_close"] = 101.5
          correction["_ingested_at"] = datetime.now(timezone.utc)

          # A failed process after staging must leave the published table intact.
          staged = cat.load_table("bronze.prices").transaction()
          staged.overwrite(pa.Table.from_pandas(correction, preserve_index=False),
                           overwrite_filter=_replacement_filter(correction))
          assert cat.load_table("bronze.prices").scan().to_arrow().to_pylist() == before

          # Only AAPL/Jan 2 returned, though both tickers and more dates were requested.
          assert write_bronze_table(cat, correction, ["AAPL", "MSFT"], "2024-01-01") == 1
          after = cat.load_table("bronze.prices").scan().to_arrow().to_pylist()
          current = {(r["ticker"], r["date"]): r for r in after}
          assert len(after) == len(current) == 6
          changed = ("AAPL", correction.iloc[0]["date"])
          assert current[changed]["close"] == 101.5
          for key in original.keys() - {changed}:
              assert current[key] == original[key], key

          # Two writers based on one snapshot: the stale writer must fail.
          first = cat.load_table("bronze.prices").transaction()
          second = cat.load_table("bronze.prices").transaction()
          arrow = pa.Table.from_pandas(correction, preserve_index=False)
          predicate = _replacement_filter(correction)
          first.overwrite(arrow, overwrite_filter=predicate)
          second.overwrite(arrow, overwrite_filter=predicate)
          first.commit_transaction()
          try:
              second.commit_transaction()
          except CommitFailedException:
              pass
          else:
              raise AssertionError("stale Iceberg writer unexpectedly committed")
          assert cat.load_table("bronze.prices").scan().to_arrow().num_rows == 6
          print("Atomic correction, partial response, stale-writer rejection and unaffected history verified")
          PY

      - name: Qualify disposable Iceberg lifecycle and recovery
        run: docker compose exec -T airflow-scheduler python - < tests/integration/qualify_iceberg_lifecycle.py

      - name: dbt build (real Trino/Iceberg, fixture data)
        run: >
          docker compose exec -T airflow-scheduler
          bash -c "cd /opt/airflow/dbt/market_pulse && dbt deps --profiles-dir . && dbt build --profiles-dir . --full-refresh"

      - name: Gold data-quality gate
        run: >
          docker compose exec -T airflow-scheduler
          python /opt/airflow/quality/validate_gold.py

      - name: Run a read-only Airflow quality task for real task metrics
        run: docker compose exec -T airflow-scheduler airflow tasks test market_pulse validate_gold 2026-11-23

      - name: Verify corrected Gold row through Trino
        run: |
          docker compose exec -T airflow-scheduler python - <<'PY'
          from trino.dbapi import connect

          conn = connect(host="trino", port=8080, user="admin", catalog="iceberg")
          cur = conn.cursor()
          cur.execute("select adj_close from gold.fct_daily_metrics where ticker = 'AAPL' and trade_date = DATE '2024-01-02'")
          rows = cur.fetchall()
          assert len(rows) == 1 and float(rows[0][0]) == 101.5, rows
          print("Trino Gold correction verified: AAPL 2024-01-02 adj_close=101.5")
          PY

      - name: One representative Trino query
        run: >
          docker compose exec -T trino
          trino --execute "select ticker, trade_date, daily_return, sma_20, is_volume_anomaly from iceberg.gold.fct_daily_metrics order by trade_date desc limit 10"

      - name: Qualify live observability and data isolation
        run: bash tests/integration/qualify_observability.sh

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose logs --no-color > /tmp/e2e-compose-logs.txt
          docker compose -f docker-compose.observability.yml logs --no-color >> /tmp/e2e-compose-logs.txt

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-compose-logs
          path: /tmp/e2e-compose-logs.txt
          retention-days: 7

      - name: Tear down the stack
        if: always()
        run: |
          docker compose -f docker-compose.observability.yml down
          docker compose down -v
          test -z "$(docker compose -f docker-compose.observability.yml ps -q)"
          test -z "$(docker compose ps -q)"
