name: marketpulse

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__METRICS__STATSD_ON: "true"
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: "9125"
    PIPELINE_ACCESS_KEY: ${PIPELINE_ACCESS_KEY}
    PIPELINE_SECRET_KEY: ${PIPELINE_SECRET_KEY}
    SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./ingestion:/opt/airflow/ingestion
    - ./quality:/opt/airflow/quality
    - ./dbt:/opt/airflow/dbt
    # Read-only: lets the manual/scheduled e2e workflow load a deterministic
    # fixture into bronze without a live yfinance call. Not used by the
    # normal daily DAG run.
    - ./tests/fixtures:/opt/airflow/tests/fixtures:ro
    - ./airflow_auth/simple_auth_manager_passwords.json.generated:/opt/airflow/simple_auth_manager_passwords.json.generated

services:
  # ---------- LAKE: object storage ----------
  minio:
    image: minio/minio:latest
    container_name: mp-minio
    ports: ["9000:9000", "9001:9001"]
    env_file: [.env]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  mc-init:
    image: minio/mc:latest
    container_name: mp-mc-init
    depends_on: { minio: { condition: service_started } }
    env_file: [.env]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done &&
      echo 'minio alias ready'"

  # ---------- LAKE: Iceberg REST catalog ----------
  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    container_name: mp-iceberg-rest
    ports: ["8181:8181"]
    depends_on: { minio: { condition: service_healthy } }
    env_file: [.env]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    healthcheck:
      # Best-effort: GET /v1/config is part of the Iceberg REST catalog
      # OpenAPI spec, but curl's presence in this image isn't confirmed —
      # nothing depends on this service by health condition (see trino's
      # depends_on below), so a wrong assumption here only shows as
      # "unhealthy" in `docker compose ps`, it won't block startup.
      test: ["CMD", "curl", "-sf", "http://localhost:8181/v1/config"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------- COMPUTE: Trino query engine ----------
  trino:
    image: trinodb/trino:latest
    container_name: mp-trino
    ports: ["8080:8080"]
    # iceberg-rest's own healthcheck uses curl, which hasn't been confirmed
    # present in that image (see its healthcheck comment below) — depending
    # on iceberg-rest by health condition here would stall trino's startup
    # indefinitely if that assumption is wrong, so this stays a plain
    # "started" dependency rather than "healthy".
    depends_on: [iceberg-rest]
    volumes:
      - ./trino/catalog:/etc/trino/catalog
    healthcheck:
      # Uses the trino CLI (bundled in this image), not curl — confirmed
      # present via `docker compose exec -T trino trino --execute "..."`
      # succeeding in the verified E2E run (see docs/testing.md).
      test: ["CMD", "trino", "--execute", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # ---------- ORCHESTRATION: Postgres + Airflow ----------
  postgres:
    image: postgres:16
    container_name: mp-postgres
    environment:
      # Local-development-only credentials — not safe for a shared/production instance.
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Only the POSTGRES_DB database is created automatically; Superset needs
      # a second "superset" database on this same instance (see below).
      - ./infra/postgres/init-superset-db.sql:/docker-entrypoint-initdb.d/init-superset-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    container_name: mp-airflow-init
    depends_on: { postgres: { condition: service_healthy } }
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        echo "Airflow DB migrated. User management handled by SimpleAuthManager via password file."

  airflow-apiserver:
    <<: *airflow-common
    container_name: mp-airflow-api
    depends_on: { airflow-init: { condition: service_completed_successfully } }
    ports: ["8085:8080"]
    command: api-server
    healthcheck:
      # Best-effort: Airflow 3's FastAPI-based API server exposes this route,
      # but it hasn't been exercised against a live container in this repo's
      # CI/E2E (the E2E fixture path never calls the Airflow API — it runs
      # ingestion/dbt/quality directly). Nothing currently depends on this
      # service being "healthy" via Compose, so a wrong endpoint here only
      # shows as "unhealthy" in `docker compose ps`, it won't block startup.
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    container_name: mp-airflow-scheduler
    depends_on: { airflow-init: { condition: service_completed_successfully } }
    command: scheduler

  airflow-dag-processor:
    <<: *airflow-common
    container_name: mp-airflow-dagproc
    depends_on: { airflow-init: { condition: service_completed_successfully } }
    command: dag-processor

  # ---------- SERVING: Superset ----------
  superset:
    image: apache/superset:latest
    container_name: mp-superset
    user: root
    ports: ["8088:8088"]
    env_file: [.env]
    environment:
      # Local-development-only defaults — SUPERSET_SECRET_KEY and the admin
      # password must be overridden via .env for anything beyond a laptop demo.
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-please-change-me-to-a-long-random-string-1234567890}
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://airflow:airflow@postgres/superset
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
    depends_on:
      postgres: { condition: service_healthy }
      trino: { condition: service_healthy }
    # fab create-admin exits non-zero (and would stop the container, since
    # this runs under `sh -c "... && ..."`) if the admin user already exists
    # on container restart — `|| true` keeps startup idempotent.
    command: >
      /bin/sh -c "
      uv pip install --python /app/.venv/bin/python3 trino sqlalchemy-trino &&
      superset db upgrade &&
      (superset fab create-admin --username \"$$SUPERSET_ADMIN_USERNAME\" --firstname a --lastname b --email a@b.com --password \"$$SUPERSET_ADMIN_PASSWORD\" || true) &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088"
    healthcheck:
      # Best-effort: Superset has historically exposed GET /health returning
      # "OK", but this hasn't been exercised against a live container in
      # this repo's CI/E2E (no automated path starts Superset today).
      test: ["CMD", "curl", "-sf", "http://localhost:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  minio_data:
  pg_data:
