apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: m4-minio
  namespace: flux-system
spec:
  interval: 20s
  url: http://market-pulse-m4-git/fixture.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: m4-minio-namespace
  namespace: flux-system
spec:
  interval: 20s
  path: ./infra/k8s/minio/namespace
  prune: true
  wait: true
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: m4-minio
