apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: m4-minio-app
  namespace: flux-system
spec:
  interval: 20s
  path: ./infra/k8s/minio/app
  prune: true
  wait: true
  timeout: 3m
  dependsOn:
    - name: m4-minio-namespace
  sourceRef:
    kind: GitRepository
    name: m4-minio
