mappings:
  - match: airflow.ti_failures
    name: airflow_task_failures_total
  - match: airflow.dag.market_pulse.*.duration
    name: market_pulse_airflow_task_duration_seconds
    observer_type: histogram
    histogram_options:
      buckets: [1, 5, 15, 30, 60, 120, 300, 600]
    labels:
      task: "$1"
  - match: airflow.scheduler_heartbeat
    name: market_pulse_airflow_scheduler_heartbeat_total
  - match: airflow.dagrun.duration.*.market_pulse
    name: market_pulse_airflow_dagrun_duration_seconds
    observer_type: histogram
    labels:
      state: "$1"
  # Drop unmatched Airflow paths rather than accidentally exporting run IDs.
  - match: "."
    match_type: regex
    action: drop
    name: dropped
