version: 2
models:
  - name: fct_daily_metrics
    columns:
      - name: ticker
        tests:
          - not_null
          - relationships: { to: ref('dim_ticker'), field: ticker }
      - name: trade_date
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ticker, trade_date]
  - name: dim_ticker
    columns:
      - name: ticker
        tests: [not_null, unique]
      - name: sector
        tests:
          - accepted_values:
              values: ['Technology', 'Financials', 'Energy', 'Consumer']